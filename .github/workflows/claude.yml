name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Ты — автоматический ревьюер. Работай полностью автономно. НИКОГДА не задавай вопросов.

            1. Получи список файлов: gh pr diff ${{ github.event.pull_request.number }} --name-only
            2. Прочитай CLAUDE.md для контекста конвенций проекта.
            3. Читай diff по файлам/группам: gh pr diff ${{ github.event.pull_request.number }} -- <путь к файлу>
               Если diff слишком большой, читай его по частям (по директориям или файлам).
            4. НЕ запускай сборку, тесты или dotnet/npm команды.
            5. Запиши результат ревью в файл review.md в текущей директории с помощью Write tool.
               Формат: заголовок, критические проблемы, некритичные замечания, позитивное. Будь лаконичен.
            6. Опубликуй: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          claude_args: "--max-turns 50 --allowedTools Write 'Bash(gh pr *)' 'Bash(gh api *)' 'Bash(git diff *)' 'Bash(git log *)'"
